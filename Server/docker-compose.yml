# XNotch Cloud for Docker Compose / Dokploy "Compose" mode.
#
# Values come from a `.env` file next to this file (copy .env.example), or from
# Dokploy's Environment tab. Dokploy's Traefik routes your domain to port 8080,
# so no host port is published.

services:
  xnotch-cloud:
    build: .
    image: xnotch-cloud:latest
    restart: unless-stopped
    expose:
      - "8080"
    # Uncomment to reach the server directly (for example without Dokploy):
    # ports:
    #   - "127.0.0.1:8080:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://drop.example.com}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN (at least 16 characters)}
      SITE_NAME: ${SITE_NAME:-XNotch Cloud}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5368709120}
      DEFAULT_EXPIRY: ${DEFAULT_EXPIRY:-86400}
      MAX_EXPIRY: ${MAX_EXPIRY:-2592000}
      ID_LENGTH: ${ID_LENGTH:-8}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_PUBLIC_PER_MINUTE: ${RATE_LIMIT_PUBLIC_PER_MINUTE:-120}
      RATE_LIMIT_PUBLIC_BURST: ${RATE_LIMIT_PUBLIC_BURST:-60}
      RATE_LIMIT_PASSWORD_PER_MINUTE: ${RATE_LIMIT_PASSWORD_PER_MINUTE:-10}
      RATE_LIMIT_PASSWORD_BURST: ${RATE_LIMIT_PASSWORD_BURST:-5}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
      RATE_LIMIT_API_BURST: ${RATE_LIMIT_API_BURST:-60}
      RATE_LIMIT_RELAY_PER_MINUTE: ${RATE_LIMIT_RELAY_PER_MINUTE:-30}
      RATE_LIMIT_RELAY_BURST: ${RATE_LIMIT_RELAY_BURST:-20}
      RATE_LIMIT_MAX_CLIENTS: ${RATE_LIMIT_MAX_CLIENTS:-10000}
      RATE_LIMIT_IDLE_SECONDS: ${RATE_LIMIT_IDLE_SECONDS:-900}
      PASSWORD_CONCURRENCY: ${PASSWORD_CONCURRENCY:-4}
      RELAY: ${RELAY:-on}
      RELAY_MAX_MESSAGE: ${RELAY_MAX_MESSAGE:-8388608}
      RELAY_MAX_PAIRS: ${RELAY_MAX_PAIRS:-64}
      RELAY_MAX_WAITING: ${RELAY_MAX_WAITING:-256}
      RELAY_PHONE_WAIT: ${RELAY_PHONE_WAIT:-10}
      RELAY_IDLE_TIMEOUT: ${RELAY_IDLE_TIMEOUT:-1800}
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      # `local` keeps files in the volume below; `s3` uses a bucket instead.
      STORAGE: ${STORAGE:-local}
      # S3-compatible storage (no MinIO needed). Example for Backblaze B2:
      #   STORAGE=s3
      #   S3_BUCKET=my-xnotch-drops
      #   S3_ENDPOINT=https://s3.eu-central-003.backblazeb2.com
      #   S3_REGION=eu-central-003
      #   S3_ACCESS_KEY_ID=<B2 keyID>
      #   S3_SECRET_ACCESS_KEY=<B2 applicationKey>
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_VIRTUAL_HOSTED_STYLE: ${S3_VIRTUAL_HOSTED_STYLE:-false}
    volumes:
      - xnotch-data:/data

volumes:
  xnotch-data:
